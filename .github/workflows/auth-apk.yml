name: Build Auth APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Configure Firebase
        env:
          AUTH_GOOGLE_SERVICES_JSON: ${{ secrets.AUTH_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$AUTH_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the AUTH_GOOGLE_SERVICES_JSON repository secret before running this workflow."
            exit 1
          fi
          printf '%s' "$AUTH_GOOGLE_SERVICES_JSON" > auth/app/google-services.json
      - name: Build Auth debug APK
        run: ./gradlew -p auth :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-debug-apk
          path: auth/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error